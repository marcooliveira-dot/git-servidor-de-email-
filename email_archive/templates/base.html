<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arquivo de e-mails</title>
<style>
:root{color-scheme:light;--ink:#152c37;--muted:#62757e;--accent:#136c65;--line:#dce6e8}*{box-sizing:border-box}body{margin:0;background:#f4f7f8;color:var(--ink);font:15px system-ui,sans-serif}header{background:#142d38;color:white;padding:18px 5%;display:flex;gap:25px;align-items:center;flex-wrap:wrap}header strong{font-size:19px}nav{display:flex;gap:18px;flex:1}nav a{color:#ddebee;text-decoration:none}main{max-width:1280px;margin:32px auto;padding:0 24px}h1{font-size:30px;margin:0 0 10px}h2{font-size:20px}p{line-height:1.6}.muted,small{color:var(--muted)}a{color:var(--accent)}.card{background:white;border:1px solid var(--line);border-radius:12px;padding:24px;margin:20px 0}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.cards .card{margin:16px 0}.metric{font-size:32px;font-weight:700}.warning{background:#fff4de;border:1px solid #e8d6a7;padding:14px;border-radius:8px}.badge{display:inline-block;padding:4px 9px;border-radius:20px;background:#e6f2ef;color:#136c65;font-size:12px}.bad{background:#fff0e9;color:#95422b}label{display:block;margin:15px 0 6px;font-weight:600}input,select{font:inherit;padding:11px;border:1px solid #c5d4d8;border-radius:7px;width:100%;background:white;color:var(--ink)}button,.button{display:inline-block;font:inherit;border:0;border-radius:7px;padding:11px 17px;background:var(--accent);color:white;text-decoration:none;cursor:pointer}.secondary{background:#e4eeee;color:var(--ink)}.filters{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.filters input{flex:2;min-width:220px}.filters select{flex:1;min-width:200px}.table{overflow:auto}table{border-collapse:collapse;width:100%;font-size:14px}td,th{text-align:left;padding:14px 12px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-weight:600}.subject{max-width:450px;overflow-wrap:anywhere}.inline{display:inline}.inline input{width:180px}.inline button{padding:6px 10px;font-size:13px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:14px/1.7 system-ui}footer{margin:35px 0;color:var(--muted);font-size:12px}.login{max-width:440px;margin:8vh auto}.pagination{display:flex;justify-content:space-between;margin-top:20px}@media(max-width:750px){.cards{grid-template-columns:1fr 1fr}nav{gap:10px}header{padding:15px 24px}main{padding:0 15px}.card{padding:18px}}
</style></head><body>
<header><strong>Arquivo de e-mails</strong>{% if user %}<nav><a href="/">Histórico</a><a href="/accounts">Contas</a><a href="/cleanup">Limpeza</a><a href="/audit">Auditoria</a></nav><form action="/logout" method="post"><input type="hidden" name="csrf_token" value="{{ csrf }}"><button class="secondary">Sair</button></form>{% endif %}</header>
<main>{% block content %}{% endblock %}<footer>Acesso exclusivo da administração · Datas exibidas em UTC · Arquivo corporativo</footer></main></body></html>
